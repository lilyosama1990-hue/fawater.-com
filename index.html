<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فاتورة — Invoice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1f2937;
  --muted:#4b5563;
  --line:#9ca3af;
  --light-line:#e5e7eb;
  --bg:#eef1f5;
  --paper:#ffffff;
  --accent:#0f2942;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:13px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;
  padding:12px;
}
.app-shell{max-width:920px;margin:0 auto;display:grid;gap:14px}
.editor-bar{
  background:#fff;
  border:1px solid var(--light-line);
  border-radius:12px;
  padding:14px 16px;
  box-shadow:0 4px 14px rgba(0,0,0,.04);
}
.top-toolbar{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  margin-bottom:12px;
  border-bottom:1px solid var(--light-line);
}
.top-toolbar h1{margin:0;font-size:16px;font-weight:800;color:var(--accent)}
.btn-group{display:flex;flex-wrap:wrap;gap:8px}
button{
  font:inherit;
  padding:7px 12px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  background:#fff;
  color:var(--ink);
  font-weight:700;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-pdf{background:#15803d;color:#fff;border-color:#15803d}
.btn-edit{background:#fef3c7;color:#92400e;border-color:#f59e0b}
.btn-edit.editing{background:#d97706;color:#fff;border-color:#b45309}
.btn-clear{background:#f3f4f6;color:#374151;border-color:#d1d5db;padding:5px 10px;font-size:12px}
.btn-danger{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;padding:4px 9px;font-size:12px}

.grid-form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;
}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px}
.field input{
  width:100%;
  font:inherit;
  padding:7px 9px;
  border:1px solid #cbd5e1;
  border-radius:6px;
  background:#fff;
}
.field input[type="file"]{padding:5px 7px;font-size:12px}
.logo-actions{display:flex;align-items:center;gap:8px;margin-top:5px}
.items-editor{margin-top:12px;padding-top:12px;border-top:1px dashed #cbd5e1}
.item-edit-row{
  display:grid;
  grid-template-columns:2.2fr .9fr 1fr .9fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:8px;
}
.err-box{
  margin-top:10px;
  padding:9px 12px;
  border-radius:7px;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
  font-size:12.5px;
  font-weight:700;
  display:none;
}
.edit-hint{
  margin-top:10px;
  padding:8px 12px;
  border-radius:7px;
  background:#fffbeb;
  border:1px solid #fcd34d;
  color:#92400e;
  font-size:12.5px;
  font-weight:700;
  display:none;
}

.invoice-page{
  background:var(--paper);
  padding:26px 28px 20px;
  border:1px solid #d1d5db;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  position:relative;
  min-height:680px;
  overflow:hidden;
}
.invoice-page.edit-mode{
  outline:2px dashed #d97706;
  outline-offset:-6px;
  background:#fffdf7;
}
.draggable-part{
  position:relative;
  transition:box-shadow .15s ease;
}
.invoice-page.edit-mode .draggable-part{
  border:1px dashed #f59e0b;
  border-radius:6px;
  background:rgba(255,251,235,.82);
  padding:4px;
}
.invoice-page.edit-mode .draggable-part.dragging{
  border-style:solid;
  border-color:#b45309;
  box-shadow:0 6px 18px rgba(180,83,9,.22);
  z-index:20;
}
.invoice-page.edit-mode [contenteditable="true"]{
  cursor:text;
  outline:1px dotted rgba(180,83,9,.55);
  border-radius:3px;
  min-height:18px;
}
.invoice-page.edit-mode [contenteditable="true"]:focus{
  outline:2px solid #d97706;
  background:#fef9c3;
}
.drag-handle{
  display:none;
  position:absolute;
  top:-11px;
  right:6px;
  background:#b45309;
  color:#fff;
  font-size:10px;
  font-weight:700;
  padding:1px 7px;
  border-radius:4px;
  cursor:grab;
  touch-action:none;
  user-select:none;
  z-index:25;
}
.drag-handle:active{cursor:grabbing}
.invoice-page.edit-mode .drag-handle{display:inline-block}

.top-three-grid{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
  gap:14px;
  margin-bottom:18px;
}
.right-col{
  text-align:right;
  font-size:12px;
  line-height:1.45;
}
.tax-title-ar{
  font-size:19px;
  font-weight:800;
  color:#111827;
  line-height:1.25;
}
.tax-title-en{
  font-size:15px;
  font-weight:700;
  color:#111827;
  direction:ltr;
  text-align:right;
  margin-bottom:12px;
}
.client-title-ar{font-weight:700;color:#111827}
.client-title-en{color:#4b5563;font-size:11px;direction:ltr;text-align:right;margin-bottom:4px}
.client-name{font-weight:700;color:#111827}
.client-sub{color:#374151}

.center-meta{
  text-align:center;
  font-size:12px;
  line-height:1.45;
  min-width:165px;
  padding-top:26px;
}
.meta-block{margin-bottom:12px}
.meta-ar{font-weight:700;color:#111827}
.meta-en{color:#4b5563;font-size:11px;direction:ltr}
.meta-val{font-weight:700;color:#111827;direction:ltr;margin-top:2px}

.left-brand-col{
  text-align:left;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  font-size:12px;
  line-height:1.45;
}
.logo-box{
  width:96px;
  height:70px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
}
.logo-box img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  display:block;
}
.seller-info{
  text-align:right;
  max-width:260px;
  width:100%;
}
.seller-name{font-weight:700;color:#111827}
.seller-line{color:#374151}

.inv-table-wrap{overflow-x:auto}
.inv-table{
  width:100%;
  border-collapse:collapse;
  font-size:11.5px;
  min-width:620px;
}
.inv-table thead th{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:6px 5px;
  font-weight:700;
  color:#111827;
  vertical-align:bottom;
  text-align:center;
  line-height:1.3;
}
.inv-table thead th small{
  display:block;
  font-weight:500;
  color:#4b5563;
  font-size:10.5px;
}
.inv-table tbody td{
  padding:8px 5px;
  border-bottom:1px solid var(--light-line);
  vertical-align:top;
  color:#111827;
}
.inv-table tbody td.desc-cell{text-align:right}
.inv-table tbody td.num-cell{text-align:center;direction:ltr;white-space:nowrap}

.bottom-zone{
  margin-top:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
}
.totals-box{
  width:100%;
  max-width:440px;
  font-size:12px;
}
.total-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 4px;
  border-bottom:1px solid var(--light-line);
}
.total-row.final{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-weight:700;
}
.total-left{
  display:flex;
  align-items:center;
  gap:14px;
  direction:ltr;
  font-weight:700;
  color:#111827;
}
.total-right{
  text-align:right;
  color:#111827;
}

.qr-stack{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  max-width:290px;
  margin-inline-start:auto;
}
.top-qr-slot{
  width:106px;
  height:106px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--light-line);
  padding:4px;
  background:#fff;
}
.top-qr-slot svg{width:100%;height:100%}
.qr-caption-box{
  font-size:10px;
  line-height:1.4;
  color:#374151;
  text-align:right;
}
.qr-caption-en{
  direction:ltr;
  text-align:left;
  font-size:9.5px;
  color:#4b5563;
}

.page-footer{
  margin-top:44px;
  padding-top:10px;
  border-top:1px solid #d1d5db;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:11px;
  color:#374151;
}
.footer-right{text-align:right;min-width:40px}
.footer-center{text-align:center;font-weight:600;min-width:60px}
.footer-left{direction:ltr;text-align:left;min-width:60px}

code.b64-box{
  direction:ltr;
  unicode-bidi:isolate;
  word-break:break-all;
  display:block;
  font-size:11.5px;
  background:#f8fafc;
  border:1px solid var(--light-line);
  padding:8px 10px;
  border-radius:6px;
  margin-top:10px;
}

@media (max-width:640px){
  .invoice-page{padding:16px 12px}
  .item-edit-row{grid-template-columns:1fr 1fr}
  .item-edit-row .desc-field{grid-column:1 / -1}
  .top-three-grid{grid-template-columns:1fr;gap:14px}
  .center-meta{padding-top:0;text-align:right}
  .left-brand-col,.seller-info,.right-col,.client-title-en,.tax-title-en{
    text-align:right;
    align-items:flex-start;
  }
  .bottom-zone{flex-direction:column}
  .qr-stack{margin-inline-start:0;align-items:flex-start}
  .qr-caption-box{text-align:right}
  .page-footer{flex-direction:column;align-items:flex-start}
}

@page{
  size:A4 portrait;
  margin:10mm;
}

@media print{
  body{background:#fff;padding:0}
  .app-shell{max-width:100%;gap:0}
  .editor-bar,.no-print,.b64-wrap,.drag-handle{display:none!important}
  .invoice-page{border:none;box-shadow:none;padding:0;outline:none!important;background:#fff!important}
  .invoice-page .draggable-part{border:none!important;background:transparent!important;padding:0!important}
  .invoice-page [contenteditable="true"]{outline:none!important;background:transparent!important}
}
</style>
</head>
<body>
<div class="app-shell">
  <section class="editor-bar no-print">
    <div class="top-toolbar">
      <h1 id="ui_barTitle">إعداد الفاتورة (ZATCA)</h1>
      <div class="btn-group">
        <button type="button" id="k_std" class="active">ضريبية (B2B)</button>
        <button type="button" id="k_smp">مبسطة (B2C)</button>
        <button type="button" id="lang_btn">Français</button>
        <button type="button" id="edit_pos_btn" class="btn-edit">تعديل الفاتورة / المواقع</button>
        <button type="button" id="reset_pos_btn" class="btn-clear">إعادة المواقع</button>
        <button type="button" id="pdf_btn" class="btn-pdf">حفظ PDF</button>
        <button type="button" id="print_btn" class="btn-primary">طباعة</button>
      </div>
    </div>

    <div class="edit-hint" id="edit_hint">
      وضع التعديل مفعّل: اضغط على أي نص داخل الفاتورة للكتابة أو التعديل فيه مباشرة، واسحب علامة (⋮⋮) لتحريك أي جزء لمكانه، ثم اضغط "إنهاء التعديل".
    </div>

    <div class="grid-form">
      <div class="field">
        <label id="lbl_logo">اللوجو (اختياري)</label>
        <input id="f_logo" type="file" accept="image/*">
        <div class="logo-actions">
          <button type="button" id="clear_logo_btn" class="btn-clear">إزالة اللوجو</button>
        </div>
      </div>
      <div class="field">
        <label id="lbl_seller">اسم الشركة</label>
        <input id="f_seller" value="">
      </div>
      <div class="field">
        <label id="lbl_vat">السجل الضريبي (15 رقم)</label>
        <input id="f_vat" inputmode="numeric" value="">
      </div>
      <div class="field">
        <label id="lbl_addr1">العنوان / الحي</label>
        <input id="f_addr1" value="">
      </div>
      <div class="field">
        <label id="lbl_phone">الهاتف / الرمز</label>
        <input id="f_phone" value="">
      </div>
      <div class="field">
        <label id="lbl_client">اسم العميل</label>
        <input id="f_client" value="">
      </div>
      <div class="field">
        <label id="lbl_clientAddr">عنوان العميل</label>
        <input id="f_clientAddr" value="">
      </div>
      <div class="field">
        <label id="lbl_clientVat">الرقم الضريبي للعميل</label>
        <input id="f_clientVat" value="">
      </div>
      <div class="field">
        <label id="lbl_inv">رقم الفاتورة</label>
        <input id="f_inv" value="SINV-001380">
      </div>
      <div class="field">
        <label id="lbl_invDate">التاريخ</label>
        <input id="f_invDate" type="date" value="2026-11-26">
      </div>
      <div class="field">
        <label id="lbl_time">وقت الإصدار (للـ QR)</label>
        <input id="f_time" type="time" step="1" value="18:03:00">
      </div>
      <div class="field">
        <label id="lbl_cur">رمز العملة</label>
        <input id="f_cur" value="﷼">
      </div>
    </div>

    <div class="items-editor">
      <div id="items_edit_list"></div>
      <button type="button" id="add_row_btn" class="btn-primary">+ إضافة بند</button>
    </div>

    <div class="err-box" id="err_box"></div>
  </section>

  <main class="invoice-page" id="invoice_sheet"></main>

  <section class="editor-bar b64-wrap no-print">
    <strong id="lbl_b64">قيمة Base64 المشفرة للـ QR (ZATCA Phase 1):</strong>
    <code class="b64-box" id="b64_out"></code>
  </section>
</div>

<script>
const ECC_PER_BLOCK = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 28];
const NUM_BLOCKS = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];

function alignPositions(ver) {
  if (ver === 1) return [];
  const n = Math.floor(ver / 7) + 2;
  const size = ver * 4 + 17;
  const step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
  const res = [6];
  for (let pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
  return res;
}
function rawModules(ver) {
  const size = ver * 4 + 17;
  let r = size * size - 8 * 8 * 3 - 15 * 2 - 1 - (size - 16) * 2;
  if (ver >= 2) {
    const n = Math.floor(ver / 7) + 2;
    r -= (n - 1) * (n - 1) * 25;
    r -= (n - 2) * 2 * 20;
    if (ver >= 7) r -= 6 * 3 * 2;
  }
  return r;
}
function dataCodewords(ver) {
  return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver - 1] * NUM_BLOCKS[ver - 1];
}
function gmul(x, y) {
  let z = 0;
  for (let i = 7; i >= 0; i--) {
    z = (z << 1) ^ ((z >>> 7) * 0x11d);
    z ^= ((y >>> i) & 1) * x;
  }
  return z & 0xff;
}
function rsRemainder(data, degree) {
  const div = new Array(degree).fill(0);
  div[degree - 1] = 1;
  let root = 1;
  for (let i = 0; i < degree; i++) {
    for (let j = 0; j < degree; j++) {
      div[j] = gmul(div[j], root);
      if (j + 1 < degree) div[j] ^= div[j + 1];
    }
    root = gmul(root, 2);
  }
  const res = new Array(degree).fill(0);
  for (const b of data) {
    const f = b ^ res.shift();
    res.push(0);
    div.forEach((c, i) => { res[i] ^= gmul(c, f); });
  }
  return res;
}
function qrMatrix(bytes) {
  let ver = 1;
  for (; ver <= 20; ver++) {
    const cap = dataCodewords(ver) * 8;
    const used = 4 + (ver < 10 ? 8 : 16) + bytes.length * 8;
    if (used <= cap) break;
  }
  if (ver > 20) throw new Error('too long');
  const bits = [];
  const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  put(4, 4);
  put(bytes.length, ver < 10 ? 8 : 16);
  bytes.forEach((b) => put(b, 8));
  const capBits = dataCodewords(ver) * 8;
  put(0, Math.min(4, capBits - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let pad = 0xec; bits.length < capBits; pad ^= 0xec ^ 0x11) put(pad, 8);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let v = 0;
    for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    data.push(v);
  }
  const nb = NUM_BLOCKS[ver - 1];
  const eccLen = ECC_PER_BLOCK[ver - 1];
  const raw = Math.floor(rawModules(ver) / 8);
  const numShort = nb - (raw % nb);
  const shortLen = Math.floor(raw / nb);
  const blocks = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
    k += dat.length;
    const ecc = rsRemainder(dat, eccLen);
    if (i < numShort) dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  const all = [];
  for (let i = 0; i < blocks[0].length; i++) {
    blocks.forEach((blk, j) => { if (i !== shortLen - eccLen || j >= numShort) all.push(blk[i]); });
  }
  const size = ver * 4 + 17;
  const m = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const set = (x, y, v) => { m[y][x] = v; fn[y][x] = true; };
  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  const ap = alignPositions(ver);
  ap.forEach((cx, i) => ap.forEach((cy, j) => {
    if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) return;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));
  const drawFormat = (mask) => {
    const d = (0 << 3) | mask;
    let rem = d;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const f = ((d << 10) | rem) ^ 0x5412;
    const bit = (i) => ((f >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) set(8, i, bit(i));
    set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
    set(8, size - 8, true);
  };
  drawFormat(0);
  if (ver >= 7) {
    let rem = ver;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    const v = (ver << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const c = ((v >>> i) & 1) !== 0;
      const a = size - 11 + (i % 3), b = Math.floor(i / 3);
      set(a, b, c); set(b, a, c);
    }
  }
  let bi = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j;
      const up = ((right + 1) & 2) === 0;
      const y = up ? size - 1 - vert : vert;
      if (!fn[y][x] && bi < all.length * 8) {
        m[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0;
        bi++;
      }
    }
  }
  const masks = [
    (x, y) => (x + y) % 2 === 0,
    (_x, y) => y % 2 === 0,
    (x) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
  ];
  const applyMask = (k) => {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && masks[k](x, y)) m[y][x] = !m[y][x];
  };
  const penalty = () => {
    let p = 0;
    const line = (get) => {
      let run = 1;
      for (let i = 1; i < size; i++) {
        if (get(i) === get(i - 1)) run++;
        else { if (run >= 5) p += 3 + run - 5; run = 1; }
      }
      if (run >= 5) p += 3 + run - 5;
      const s = Array.from({ length: size }, (_, i) => (get(i) ? '1' : '0')).join('');
      for (const pat of ['00001011101', '10111010000']) {
        let at = s.indexOf(pat);
        while (at >= 0) { p += 40; at = s.indexOf(pat, at + 1); }
      }
    };
    for (let y = 0; y < size; y++) line((i) => m[y][i]);
    for (let x = 0; x < size; x++) line((i) => m[i][x]);
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const c = m[y][x];
      if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) p += 3;
    }
    let dark = 0;
    m.forEach((r) => r.forEach((c) => { if (c) dark++; }));
    p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    return p;
  };
  let best = 0, bestP = Infinity;
  for (let k = 0; k < 8; k++) {
    applyMask(k); drawFormat(k);
    const p = penalty();
    if (p < bestP) { best = k; bestP = p; }
    applyMask(k);
  }
  applyMask(best); drawFormat(best);
  return m;
}

function utf8(s) { return Array.from(new TextEncoder().encode(String(s ?? ''))); }
function tlv(tag, value) {
  const v = utf8(value);
  return [tag, v.length, ...v];
}
function zatcaPayload(seller, vat, timestamp, total, vatTotal) {
  const bytes = [...tlv(1, seller), ...tlv(2, vat), ...tlv(3, timestamp), ...tlv(4, total), ...tlv(5, vatTotal)];
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtFixed2(n) {
  return Number(n || 0).toFixed(2);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function renderInvoice() {
  const t = UI[lang];
  const ed = edAttr();
  const taxTitleAr = kind === 'simplified' ? t.taxTitleSmpAr : t.taxTitleStdAr;
  const taxTitleEn = kind === 'simplified' ? t.taxTitleSmpEn : t.taxTitleStdEn;
  const seller = $('f_seller').value.trim();
  const vat = $('f_vat').value.replace(/\D/g, '').slice(0, 15);
  const addr1 = $('f_addr1').value.trim();
  const phone = $('f_phone').value.trim();
  const client = $('f_client').value.trim();
  const clientAddr = $('f_clientAddr').value.trim();
  const clientVat = $('f_clientVat').value.trim();
  const invNo = $('f_inv').value.trim();
  const invDate = $('f_invDate').value.trim();
  let timeVal = $('f_time').value.trim() || '00:00:00';
  if (timeVal.length === 5) timeVal += ':00';
  const cur = $('f_cur').value.trim() || '﷼';

  const errs = [];
  if (!seller) errs.push(t.errSeller);
  if (!/^3\d{13}3$/.test(vat)) errs.push(t.errVat);

  let sumEx = 0;
  let sumVat = 0;
  let sumIn = 0;

  const lineHtml = rows.map((r, idx) => {
    const q = Number(r.qty);
    const p = Number(r.price);
    const tr = Number(r.taxRate);
    const valid = String(r.desc || '').trim() !== '' && isFinite(q) && q > 0 && isFinite(p) && p >= 0 && isFinite(tr) && tr >= 0;
    if (!valid) errs.push(t.errItem);

    const ex = valid ? (q * p) : 0;
    const vAmt = valid ? (ex * (tr / 100)) : 0;
    const inc = ex + vAmt;

    sumEx += ex;
    sumVat += vAmt;
    sumIn += inc;

    return `
      <tr>
        <td class="desc-cell" ${ed}>${idx + 1} ${esc(r.desc || '-')}</td>
        <td class="num-cell" ${ed}>${esc(r.qty || '0')}</td>
        <td class="num-cell" ${ed}>${fmtNum(p)}</td>
        <td class="num-cell" ${ed}>${fmtNum(ex)}</td>
        <td class="num-cell" ${ed}>${fmtNum(vAmt)}<br><small>${tr}%</small></td>
        <td class="num-cell" ${ed}>${fmtNum(inc)}</td>
      </tr>
    `;
  }).join('');

  const errBox = $('err_box');
  errBox.style.display = errs.length ? 'block' : 'none';
  errBox.textContent = errs.join(' ');

  let qrSvg = '';
  let b64 = '';
  if (!errs.length) {
    const isoStamp = `${invDate || '2026-11-26'}T${timeVal}Z`;
    b64 = zatcaPayload(seller, vat, isoStamp, fmtFixed2(sumIn), fmtFixed2(sumVat));
    const mat = qrMatrix(utf8(b64));
    const sz = mat.length + 6;
    let dPath = '';
    mat.forEach((row, y) => {
      row.forEach((cell, x) => {
        if (cell) dPath += `M${x + 3} ${y + 3}h1v1h-1z`;
      });
    });
    qrSvg = `<svg viewBox="0 0 ${sz} ${sz}" shape-rendering="crispEdges"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${dPath}" fill="#111827"/></svg>`;
  }

  $('b64_out').textContent = b64;

  $('invoice_sheet').innerHTML = `
    <div class="top-three-grid">
      <div class="draggable-part right-col" data-pos-key="client" style="${posStyle('client')}">
        <span class="drag-handle">${t.tagClient}</span>
        <div class="tax-title-ar" ${ed}>${esc(taxTitleAr)}</div>
        <div class="tax-title-en" ${ed}>${esc(taxTitleEn)}</div>
        <div class="client-title-ar" ${ed}>${t.clientAr}</div>
        <div class="client-title-en" ${ed}>${t.clientEn}</div>
        <div class="client-name" ${ed}>${esc(client)}</div>
        <div class="client-sub" ${ed}>${esc(clientAddr)}</div>
        <div class="client-sub" ${ed}>${clientVat ? `${t.vatRegAr} ${esc(clientVat)}` : ''}</div>
      </div>

      <div class="draggable-part center-meta" data-pos-key="meta" style="${posStyle('meta')}">
        <span class="drag-handle">${t.tagMeta}</span>
        <div class="meta-block">
          <div class="meta-ar" ${ed}>${t.invNoAr}</div>
          <div class="meta-en" ${ed}>${t.invNoEn}</div>
          <div class="meta-val" ${ed}>${esc(invNo)}</div>
        </div>
        <div class="meta-block">
          <div class="meta-ar" ${ed}>${t.dateAr}</div>
          <div class="meta-en" ${ed}>${t.dateEn}</div>
          <div class="meta-val" ${ed}>${esc(invDate)}</div>
        </div>
      </div>

      <div class="draggable-part left-brand-col" data-pos-key="brand" style="${posStyle('brand')}">
        <span class="drag-handle">${t.tagBrand}</span>
        ${logoSrc ? `<div class="logo-box"><img src="${logoSrc}" alt="Logo"></div>` : ''}
        <div class="seller-info">
          <div class="seller-name" ${ed}>${esc(seller)}</div>
          <div class="seller-line" ${ed}>${esc(addr1)}</div>
          <div class="seller-line" ${ed}>${esc(phone)}</div>
          <div class="seller-line" ${ed}>${vat ? `${t.vatRegAr} ${esc(vat)}` : ''}</div>
        </div>
      </div>
    </div>

    <div class="draggable-part inv-table-wrap" data-pos-key="table" style="${posStyle('table')}">
      <span class="drag-handle">${t.tagTable}</span>
      <table class="inv-table">
        <thead>
          <tr>
            <th ${ed}>${t.thDesc}<small>${t.thDescSub}</small></th>
            <th ${ed}>${t.thQty}<small>${t.thQtySub}</small></th>
            <th ${ed}>${t.thPrice}<small>${t.thPriceSub}</small></th>
            <th ${ed}>${t.thTaxable}<small>${t.thTaxableSub}</small></th>
            <th ${ed}>${t.thVatAmt}<small>${t.thVatAmtSub}</small></th>
            <th ${ed}>${t.thTotal}<small>${t.thTotalSub}</small></th>
          </tr>
        </thead>
        <tbody>${lineHtml}</tbody>
      </table>
    </div>

    <div class="bottom-zone">
      <div class="draggable-part totals-box" data-pos-key="totals" style="${posStyle('totals')}">
        <span class="drag-handle">${t.tagTotals}</span>
        <div class="total-row">
          <div class="total-left"><span ${ed}>${fmtNum(sumEx)}</span><span ${ed}>${esc(cur)}</span></div>
          <div class="total-right" ${ed}>${t.subLbl}</div>
        </div>
        <div class="total-row">
          <div class="total-left"><span ${ed}>${fmtNum(sumVat)}</span><span ${ed}>${esc(cur)}</span></div>
          <div class="total-right" ${ed}>${t.vatLbl}</div>
        </div>
        <div class="total-row final">
          <div class="total-left"><span ${ed}>${fmtNum(sumIn)}</span><span ${ed}>${esc(cur)}</span></div>
          <div class="total-right" ${ed}>${t.totLbl}</div>
        </div>
      </div>

      <div class="qr-stack">
        ${qrSvg ? `
          <div class="draggable-part top-qr-slot" data-pos-key="qr" style="${posStyle('qr')}">
            <span class="drag-handle">${t.tagQr}</span>
            ${qrSvg}
          </div>
        ` : ''}
        <div class="draggable-part qr-caption-box" data-pos-key="qrCap" style="${posStyle('qrCap')}">
          <span class="drag-handle">${t.tagQrCap}</span>
          <div ${ed}>${esc(t.qrCapAr)}</div>
          <div class="qr-caption-en" ${ed}>${esc(t.qrCapEn)}</div>
        </div>
      </div>
    </div>

    <footer class="page-footer">
      <div class="footer-right" ${ed}>${esc(t.pageLbl)}</div>
      <div class="footer-center" ${ed}>${esc(seller)}</div>
      <div class="footer-left" ${ed}>${esc(invNo)}</div>
    </footer>
  `;
}

let activeDrag = null;

$('invoice_sheet').addEventListener('pointerdown', (e) => {
  if (!editMode) return;
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;
  const part = handle.closest('.draggable-part');
  if (!part) return;
  const key = part.dataset.posKey;
  if (!key) return;
  const current = positions[key] || { x: 0, y: 0 };
  activeDrag = {
    el: part,
    key,
    startX: e.clientX,
    startY: e.clientY,
    origX: current.x,
    origY: current.y
  };
  part.classList.add('dragging');
  handle.setPointerCapture(e.pointerId);
});

$('invoice_sheet').addEventListener('pointermove', (e) => {
  if (!activeDrag) return;
  const dx = e.clientX - activeDrag.startX;
  const dy = e.clientY - activeDrag.startY;
  const nextX = activeDrag.origX + dx;
  const nextY = activeDrag.origY + dy;
  positions[activeDrag.key] = { x: nextX, y: nextY };
  activeDrag.el.style.transform = `translate3d(${Math.round(nextX)}px,${Math.round(nextY)}px,0)`;
});

function finishDrag() {
  if (!activeDrag) return;
  activeDrag.el.classList.remove('dragging');
  savePositions();
  activeDrag = null;
}

$('invoice_sheet').addEventListener('pointerup', finishDrag);
$('invoice_sheet').addEventListener('pointercancel', finishDrag);

async function downloadInvoicePDF() {
  const btn = $('pdf_btn');
  const t = UI[lang];
  const sheet = $('invoice_sheet');
  const invNum = ($('f_inv').value || 'invoice').trim().replace(/[^\w\-]/g, '_');

  if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
    window.print();
    return;
  }

  const prevEdit = editMode;
  if (prevEdit) {
    editMode = false;
    applyLabels();
  }

  btn.disabled = true;
  btn.textContent = t.pdfBusy;

  try {
    const canvas = await window.html2canvas(sheet, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff'
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 8;
    const availW = pageW - margin * 2;
    const imgH = (canvas.height * availW) / canvas.width;

    if (imgH <= pageH - margin * 2) {
      pdf.addImage(imgData, 'PNG', margin, margin, availW, imgH);
    } else {
      let heightLeft = imgH;
      let position = margin;
      pdf.addImage(imgData, 'PNG', margin, position, availW, imgH);
      heightLeft -= (pageH - margin * 2);
      while (heightLeft > 0) {
        position = heightLeft - imgH + margin;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', margin, position, availW, imgH);
        heightLeft -= (pageH - margin * 2);
      }
    }

    pdf.save(`Invoice-${invNum}.pdf`);
  } catch (err) {
    window.print();
  } finally {
    btn.disabled = false;
    btn.textContent = t.pdf;
    if (prevEdit) {
      editMode = true;
      applyLabels();
    }
  }
}

$('edit_pos_btn').onclick = () => {
  editMode = !editMode;
  applyLabels();
};

$('reset_pos_btn').onclick = () => {
  positions = {};
  savePositions();
  renderInvoice();
};

$('f_logo').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    logoSrc = String(reader.result || '');
    renderInvoice();
  };
  reader.readAsDataURL(file);
});

$('clear_logo_btn').onclick = () => {
  logoSrc = '';
  $('f_logo').value = '';
  renderInvoice();
};

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.closest && el.closest('#invoice_sheet')) return;
  if (el.dataset && el.dataset.row !== undefined) {
    rows[Number(el.dataset.row)][el.dataset.key] = el.value;
    renderInvoice();
  } else if (el.closest('.grid-form')) {
    renderInvoice();
  }
});

document.addEventListener('click', (e) => {
  const delBtn = e.target.closest('[data-del]');
  if (delBtn && rows.length > 1) {
    rows.splice(Number(delBtn.dataset.del), 1);
    renderItemsEditor();
    renderInvoice();
  }
});

$('add_row_btn').onclick = () => {
  rows.push({ desc: '', qty: '1', price: '0', taxRate: '15' });
  renderItemsEditor();
  renderInvoice();
};

$('k_std').onclick = () => {
  kind = 'standard';
  $('k_std').className = 'active';
  $('k_smp').className = '';
  renderInvoice();
};

$('k_smp').onclick = () => {
  kind = 'simplified';
  $('k_smp').className = 'active';
  $('k_std').className = '';
  renderInvoice();
};

$('lang_btn').onclick = () => {
  lang = lang === 'ar' ? 'fr' : 'ar';
  applyLabels();
  renderItemsEditor();
};

$('pdf_btn').onclick = downloadInvoicePDF;
$('print_btn').onclick = () => window.print();

applyLabels();
renderItemsEditor();
</script>
</body>
</html>
