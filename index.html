<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فاتورة ضريبية — Tax Invoice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1f2937;
  --muted:#4b5563;
  --line:#9ca3af;
  --light-line:#e5e7eb;
  --bg:#eef1f5;
  --paper:#ffffff;
  --accent:#0f2942;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:13.5px/1.55 system-ui,"Segoe UI",Tahoma,sans-serif;
  padding:14px;
}
.app-shell{max-width:920px;margin:0 auto;display:grid;gap:16px}
.editor-bar{
  background:#fff;
  border:1px solid var(--light-line);
  border-radius:12px;
  padding:14px 16px;
  box-shadow:0 4px 14px rgba(0,0,0,.04);
}
.top-toolbar{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  margin-bottom:12px;
  border-bottom:1px solid var(--light-line);
}
.top-toolbar h1{margin:0;font-size:16px;font-weight:800;color:var(--accent)}
.btn-group{display:flex;flex-wrap:wrap;gap:8px}
button{
  font:inherit;
  padding:7px 12px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  background:#fff;
  color:var(--ink);
  font-weight:700;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-pdf{background:#15803d;color:#fff;border-color:#15803d}
.btn-danger{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;padding:4px 9px;font-size:12px}

.grid-form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;
}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:3px}
.field input{
  width:100%;
  font:inherit;
  padding:7px 9px;
  border:1px solid #cbd5e1;
  border-radius:6px;
  background:#fff;
}
.items-editor{margin-top:12px;padding-top:12px;border-top:1px dashed #cbd5e1}
.item-edit-row{
  display:grid;
  grid-template-columns:2.2fr .9fr 1fr .9fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:8px;
}
.err-box{
  margin-top:10px;
  padding:9px 12px;
  border-radius:7px;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#991b1b;
  font-size:12.5px;
  font-weight:700;
  display:none;
}

.invoice-page{
  background:var(--paper);
  padding:28px 30px 22px;
  border:1px solid #d1d5db;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  position:relative;
}
.header-split{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
}
.seller-block{
  text-align:right;
  max-width:340px;
  font-size:13px;
  line-height:1.5;
}
.seller-name{font-weight:700;color:#111827;margin-bottom:2px}
.seller-line{color:#374151}
.qr-block{
  width:128px;
  height:128px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--light-line);
  padding:4px;
  background:#fff;
}
.qr-block svg{width:100%;height:100%}

.doc-title-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin:18px 0 12px;
  gap:10px;
}
.doc-title-en{font-size:18px;font-weight:500;color:#111827;text-align:left;direction:ltr}
.doc-num{font-size:17px;font-weight:700;color:#111827;text-align:center;direction:ltr}
.doc-title-ar{font-size:18px;font-weight:700;color:#111827;text-align:right}

.meta-dates-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:14px;
}
.meta-dates-table{
  border-collapse:collapse;
  font-size:12.5px;
  min-width:360px;
}
.meta-dates-table td{
  padding:2px 10px;
  border:none;
}
.meta-dates-table .col-en{color:#4b5563;text-align:left;direction:ltr}
.meta-dates-table .col-val{font-weight:600;color:#111827;text-align:center;direction:ltr}
.meta-dates-table .col-ar{color:#374151;text-align:right}

.inv-table-wrap{overflow-x:auto}
.inv-table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
  min-width:640px;
}
.inv-table thead th{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:7px 6px;
  font-weight:700;
  color:#111827;
  vertical-align:bottom;
  text-align:center;
  line-height:1.35;
}
.inv-table thead th small{
  display:block;
  font-weight:500;
  color:#4b5563;
  font-size:11px;
}
.inv-table tbody td{
  padding:9px 6px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  color:#111827;
}
.inv-table tbody td.desc-cell{text-align:right}
.inv-table tbody td.num-cell{text-align:center;direction:ltr;white-space:nowrap}

.summary-area{
  display:flex;
  justify-content:flex-start;
  margin-top:14px;
}
.summary-table{
  width:100%;
  max-width:470px;
  border-collapse:collapse;
  font-size:12.5px;
}
.summary-table td{
  padding:5px 6px;
  border-bottom:1px solid var(--light-line);
}
.summary-table tr.grand-row td{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-weight:700;
  font-size:13px;
  padding:7px 6px;
}
.summary-table .s-val{
  text-align:left;
  direction:ltr;
  white-space:nowrap;
  width:110px;
}
.summary-table .s-lbl{
  text-align:right;
  color:#111827;
  line-height:1.4;
}

.payment-ref{
  margin-top:18px;
  display:flex;
  align-items:center;
  gap:16px;
  font-size:12.5px;
}
.payment-ref .ref-en{color:#374151;direction:ltr}
.payment-ref .ref-val{font-weight:600;color:#111827;direction:ltr}
.payment-ref .ref-ar{color:#374151}

.page-footer{
  margin-top:42px;
  padding-top:10px;
  border-top:1px solid #d1d5db;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:14px;
  font-size:11.5px;
  color:#374151;
}
.footer-left{direction:ltr;text-align:left;line-height:1.45}
.footer-right{direction:ltr;text-align:right;line-height:1.45}

code.b64-box{
  direction:ltr;
  unicode-bidi:isolate;
  word-break:break-all;
  display:block;
  font-size:11.5px;
  background:#f8fafc;
  border:1px solid var(--light-line);
  padding:8px 10px;
  border-radius:6px;
  margin-top:10px;
}

@media (max-width:640px){
  .invoice-page{padding:18px 14px}
  .item-edit-row{grid-template-columns:1fr 1fr}
  .item-edit-row .desc-field{grid-column:1 / -1}
  .doc-title-row{grid-template-columns:1fr;text-align:center}
  .doc-title-en,.doc-title-ar{text-align:center}
  .meta-dates-table{min-width:100%}
  .page-footer{flex-direction:column;align-items:flex-start}
}

@page{
  size:A4 portrait;
  margin:10mm;
}

@media print{
  body{background:#fff;padding:0}
  .app-shell{max-width:100%;gap:0}
  .editor-bar,.no-print,.b64-wrap{display:none!important}
  .invoice-page{border:none;box-shadow:none;padding:0}
}
</style>
</head>

<div class="app-shell">

  <section class="editor-bar b64-wrap no-print">
    <strong id="lbl_b64">قيمة Base64 المشفرة للـ QR (ZATCA Phase 1):</strong>

<script>
const ECC_PER_BLOCK = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 28];
const NUM_BLOCKS = [1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];

function alignPositions(ver) {
  if (ver === 1) return [];
  const n = Math.floor(ver / 7) + 2;
  const size = ver * 4 + 17;
  const step = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
  const res = [6];
  for (let pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
  return res;
}
function rawModules(ver) {
  const size = ver * 4 + 17;
  let r = size * size - 8 * 8 * 3 - 15 * 2 - 1 - (size - 16) * 2;
  if (ver >= 2) {
    const n = Math.floor(ver / 7) + 2;
    r -= (n - 1) * (n - 1) * 25;
    r -= (n - 2) * 2 * 20;
    if (ver >= 7) r -= 6 * 3 * 2;
  }
  return r;
}
function dataCodewords(ver) {
  return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ver - 1] * NUM_BLOCKS[ver - 1];
}
function gmul(x, y) {
  let z = 0;
  for (let i = 7; i >= 0; i--) {
    z = (z << 1) ^ ((z >>> 7) * 0x11d);
    z ^= ((y >>> i) & 1) * x;
  }
  return z & 0xff;
}
function rsRemainder(data, degree) {
  const div = new Array(degree).fill(0);
  div[degree - 1] = 1;
  let root = 1;
  for (let i = 0; i < degree; i++) {
    for (let j = 0; j < degree; j++) {
      div[j] = gmul(div[j], root);
      if (j + 1 < degree) div[j] ^= div[j + 1];
    }
    root = gmul(root, 2);
  }
  const res = new Array(degree).fill(0);
  for (const b of data) {
    const f = b ^ res.shift();
    res.push(0);
    div.forEach((c, i) => { res[i] ^= gmul(c, f); });
  }
  return res;
}
function qrMatrix(bytes) {
  let ver = 1;
  for (; ver <= 20; ver++) {
    const cap = dataCodewords(ver) * 8;
    const used = 4 + (ver < 10 ? 8 : 16) + bytes.length * 8;
    if (used <= cap) break;
  }
  if (ver > 20) throw new Error('too long');
  const bits = [];
  const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  put(4, 4);
  put(bytes.length, ver < 10 ? 8 : 16);
  bytes.forEach((b) => put(b, 8));
  const capBits = dataCodewords(ver) * 8;
  put(0, Math.min(4, capBits - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let pad = 0xec; bits.length < capBits; pad ^= 0xec ^ 0x11) put(pad, 8);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let v = 0;
    for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    data.push(v);
  }
  const nb = NUM_BLOCKS[ver - 1];
  const eccLen = ECC_PER_BLOCK[ver - 1];
  const raw = Math.floor(rawModules(ver) / 8);
  const numShort = nb - (raw % nb);
  const shortLen = Math.floor(raw / nb);
  const blocks = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
    k += dat.length;
    const ecc = rsRemainder(dat, eccLen);
    if (i < numShort) dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  const all = [];
  for (let i = 0; i < blocks[0].length; i++) {
    blocks.forEach((blk, j) => { if (i !== shortLen - eccLen || j >= numShort) all.push(blk[i]); });
  }
  const size = ver * 4 + 17;
  const m = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const set = (x, y, v) => { m[y][x] = v; fn[y][x] = true; };
  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  const ap = alignPositions(ver);
  ap.forEach((cx, i) => ap.forEach((cy, j) => {
    if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) return;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));
  const drawFormat = (mask) => {
    const d = (0 << 3) | mask;
    let rem = d;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const f = ((d << 10) | rem) ^ 0x5412;
    const bit = (i) => ((f >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) set(8, i, bit(i));
    set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
    set(8, size - 8, true);
  };
  drawFormat(0);
  if (ver >= 7) {
    let rem = ver;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    const v = (ver << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const c = ((v >>> i) & 1) !== 0;
      const a = size - 11 + (i % 3), b = Math.floor(i / 3);
      set(a, b, c); set(b, a, c);
    }
  }
  let bi = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j;
      const up = ((right + 1) & 2) === 0;
      const y = up ? size - 1 - vert : vert;
      if (!fn[y][x] && bi < all.length * 8) {
        m[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0;
        bi++;
      }
    }
  }
  const masks = [
    (x, y) => (x + y) % 2 === 0,
    (_x, y) => y % 2 === 0,
    (x) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
    (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
  ];
  const applyMask = (k) => {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && masks[k](x, y)) m[y][x] = !m[y][x];
  };
  const penalty = () => {
    let p = 0;
    const line = (get) => {
      let run = 1;
      for (let i = 1; i < size; i++) {
        if (get(i) === get(i - 1)) run++;
        else { if (run >= 5) p += 3 + run - 5; run = 1; }
      }
      if (run >= 5) p += 3 + run - 5;
      const s = Array.from({ length: size }, (_, i) => (get(i) ? '1' : '0')).join('');
      for (const pat of ['00001011101', '10111010000']) {
        let at = s.indexOf(pat);
        while (at >= 0) { p += 40; at = s.indexOf(pat, at + 1); }
      }
    };
    for (let y = 0; y < size; y++) line((i) => m[y][i]);
    for (let x = 0; x < size; x++) line((i) => m[i][x]);
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const c = m[y][x];
      if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) p += 3;
    }
    let dark = 0;
    m.forEach((r) => r.forEach((c) => { if (c) dark++; }));
    p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    return p;
  };
  let best = 0, bestP = Infinity;
  for (let k = 0; k < 8; k++) {
    applyMask(k); drawFormat(k);
    const p = penalty();
    if (p < bestP) { best = k; bestP = p; }
    applyMask(k);
  }
  applyMask(best); drawFormat(best);
  return m;
}

function utf8(s) { return Array.from(new TextEncoder().encode(String(s ?? ''))); }
function tlv(tag, value) {
  const v = utf8(value);
  return [tag, v.length, ...v];
}
function zatcaPayload(seller, vat, timestamp, total, vatTotal) {
  const bytes = [...tlv(1, seller), ...tlv(2, vat), ...tlv(3, timestamp), ...tlv(4, total), ...tlv(5, vatTotal)];
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

const $ = (id) => document.getElementById(id);
let lang = 'ar';
let kind = 'standard';
let rows = [
  { desc: 'شيرنك 20 قارورة 330 مل', qty: '500', price: '4', taxRate: '15', taxLabel: 'Sales Tax' }
];

function fmtDateDMY(isoDate) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(isoDate || '').trim());
  return m ? `${m[3]}/${m[2]}/${m[1]}` : (isoDate || '');
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtFixed2(n) {
  return Number(n || 0).toFixed(2);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function renderInvoice() {
  const t = UI[lang];
  const seller = $('f_seller').value.trim();
  const addr1 = $('f_addr1').value.trim();
  const addr2 = $('f_addr2').value.trim();
  const phone = $('f_phone').value.trim();
  const country = $('f_country').value.trim();
  const client = $('f_client').value.trim();
  const vat = $('f_vat').value.replace(/\D/g, '').slice(0, 15);
  const invNo = $('f_inv').value.trim();
  const invDate = $('f_invDate').value.trim();
  const dueDate = $('f_dueDate').value.trim();
  const supDate = $('f_supDate').value.trim();
  let timeVal = $('f_time').value.trim() || '00:00:00';
  if (timeVal.length === 5) timeVal += ':00';
  const payRef = $('f_payRef').value.trim();
  const email = $('f_email').value.trim();
  const web = $('f_web').value.trim();
  const cur = $('f_cur').value.trim() || 'SR';

  const errs = [];
  if (!seller) errs.push(t.errSeller);
  if (!/^3\d{13}3$/.test(vat)) errs.push(t.errVat);

  let sumEx = 0;
  let sumVat = 0;
  let sumIn = 0;

  const lineHtml = rows.map((r) => {
    const q = Number(r.qty);
    const p = Number(r.price);
    const tr = Number(r.taxRate);
    const valid = String(r.desc || '').trim() !== '' && isFinite(q) && q > 0 && isFinite(p) && p >= 0 && isFinite(tr) && tr >= 0;
    if (!valid) errs.push(t.errItem);

    const ex = valid ? (q * p) : 0;
    const vAmt = valid ? (ex * (tr / 100)) : 0;
    const inc = ex + vAmt;

    sumEx += ex;
    sumVat += vAmt;
    sumIn += inc;

    return `
      <tr>
        <td class="desc-cell">${esc(r.desc || '-')}</td>
        <td class="num-cell">${fmtNum(q)} Units</td>
        <td class="num-cell">${fmtNum(p)} ${esc(cur)}</td>
        <td class="num-cell">${esc(r.taxLabel || 'Sales Tax')}<br>${tr}%</td>
        <td class="num-cell">${fmtNum(ex)} ${esc(cur)}</td>
        <td class="num-cell">${fmtNum(vAmt)} ${esc(cur)}</td>
        <td class="num-cell">${fmtNum(inc)} ${esc(cur)}</td>
      </tr>
    `;
  }).join('');

  const errBox = $('err_box');
  errBox.style.display = errs.length ? 'block' : 'none';
  errBox.textContent = errs.join(' ');

  let qrSvg = '';
  let b64 = '';
  if (!errs.length) {
    const isoStamp = `${invDate || '2026-11-25'}T${timeVal}Z`;
    b64 = zatcaPayload(seller, vat, isoStamp, fmtFixed2(sumIn), fmtFixed2(sumVat));
    const mat = qrMatrix(utf8(b64));
    const sz = mat.length + 6;
    let dPath = '';
    mat.forEach((row, y) => {
      row.forEach((cell, x) => {
        if (cell) dPath += `M${x + 3} ${y + 3}h1v1h-1z`;
      });
    });
    qrSvg = `<svg viewBox="0 0 ${sz} ${sz}" shape-rendering="crispEdges"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${dPath}" fill="#111827"/></svg>`;
  }

  $('b64_out').textContent = b64;

  const hEn = kind === 'standard' ? t.titleEn : t.simpEn;
  const hAr = kind === 'standard' ? t.titleAr : t.simpAr;

  $('invoice_sheet').innerHTML = `
    <div class="header-split">
      <div class="seller-block">
        <div class="seller-name">${esc(seller)}</div>
        ${addr1 ? `<div class="seller-line">${esc(addr1)}</div>` : ''}
        ${addr2 ? `<div class="seller-line">${esc(addr2)}</div>` : ''}
        ${phone ? `<div class="seller-line">${esc(phone)}</div>` : ''}
        ${country ? `<div class="seller-line">${esc(country)}</div>` : ''}
      </div>
      <div class="qr-block">${qrSvg}</div>
    </div>

    ${client ? `<div style="margin-top:8px;font-size:13.5px;font-weight:600;color:#111827;text-align:right">${esc(client)}</div>` : ''}

    <div class="doc-title-row">
      <div class="doc-title-en">${hEn}</div>
      <div class="doc-num">${esc(invNo)}</div>
      <div class="doc-title-ar">${hAr}</div>
    </div>

    <div class="meta-dates-wrap">
      <table class="meta-dates-table">
        <tr>
          <td class="col-en">${t.invDateEn}</td>
          <td class="col-val">${esc(fmtDateDMY(invDate))}</td>
          <td class="col-ar">${t.invDateAr}</td>
        </tr>
        <tr>
          <td class="col-en">${t.dueDateEn}</td>
          <td class="col-val">${esc(fmtDateDMY(dueDate))}</td>
          <td class="col-ar">${t.dueDateAr}</td>
        </tr>
        <tr>
          <td class="col-en">${t.supDateEn}</td>
          <td class="col-val">${esc(fmtDateDMY(supDate))}</td>
          <td class="col-ar">${t.supDateAr}</td>
        </tr>
      </table>
    </div>

    <div class="inv-table-wrap">
      <table class="inv-table">
        <thead>
          <tr>
            <th>${t.thDesc}<small>${t.thDescSub}</small></th>
            <th>${t.thQty}<small>${t.thQtySub}</small></th>
            <th>${t.thPrice}<small>${t.thPriceSub}</small></th>
            <th>${t.thTax}<small>${t.thTaxSub}</small></th>
            <th>${t.thSubEx}<small>${t.thSubExSub}</small></th>
            <th>${t.thVatAmt}<small>${t.thVatAmtSub}</small></th>
            <th>${t.thSubIn}<small>${t.thSubInSub}</small></th>
          </tr>
        </thead>
        <tbody>${lineHtml}</tbody>
      </table>
    </div>

    <div class="summary-area">
      <table class="summary-table">
        <tr>
          <td class="s-val">${fmtNum(sumEx)} ${esc(cur)}</td>
          <td class="s-lbl">${t.taxableLbl}</td>
        </tr>
        <tr>
          <td class="s-val">${fmtNum(sumVat)} ${esc(cur)}</td>
          <td class="s-lbl">${t.vatTaxesLbl}</td>
        </tr>
        <tr class="grand-row">
          <td class="s-val">${fmtNum(sumIn)} ${esc(cur)}</td>
          <td class="s-lbl">${t.grandLbl}</td>
        </tr>
      </table>
    </div>

    <div class="payment-ref">
      <span class="ref-en">${t.payEn}</span>
      <span class="ref-val">${esc(payRef)}</span>
      <span class="ref-ar">${t.payAr}</span>
    </div>

    <footer class="page-footer">
      <div class="footer-left">
        ${esc(email)} ${esc(web)} <strong>${esc(vat)}</strong>
      </div>
      <div class="footer-right">
        <div>${esc(invDate)} ${esc(timeVal)}</div>
        <div>${esc(t.pageLbl)}</div>
      </div>
    </footer>
  `;
}

async function downloadInvoicePDF() {
  const btn = $('pdf_btn');
  const t = UI[lang];
  const sheet = $('invoice_sheet');
  const invNum = ($('f_inv').value || 'invoice').trim().replace(/[^\w\-]/g, '_');

  if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
    window.print();
    return;
  }

  btn.disabled = true;
  btn.textContent = t.pdfBusy;

  try {
    const canvas = await window.html2canvas(sheet, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff'
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 8;
    const availW = pageW - margin * 2;
    const imgH = (canvas.height * availW) / canvas.width;

    if (imgH <= pageH - margin * 2) {
      pdf.addImage(imgData, 'PNG', margin, margin, availW, imgH);
    } else {
      let heightLeft = imgH;
      let position = margin;
      pdf.addImage(imgData, 'PNG', margin, position, availW, imgH);
      heightLeft -= (pageH - margin * 2);
      while (heightLeft > 0) {
        position = heightLeft - imgH + margin;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', margin, position, availW, imgH);
        heightLeft -= (pageH - margin * 2);
      }
    }

    pdf.save(`Invoice-${invNum}.pdf`);
  } catch (err) {
    window.print();
  } finally {
    btn.disabled = false;
    btn.textContent = t.pdf;
  }
}

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.row !== undefined) {
    rows[Number(el.dataset.row)][el.dataset.key] = el.value;
    renderInvoice();
  } else if (el.closest('.grid-form')) {
    renderInvoice();
  }
});

document.addEventListener('click', (e) => {
  const delBtn = e.target.closest('[data-del]');
  if (delBtn && rows.length > 1) {
    rows.splice(Number(delBtn.dataset.del), 1);
    renderItemsEditor();
    renderInvoice();
  }
});

$('add_row_btn').onclick = () => {
  rows.push({ desc: 'صنف جديد', qty: '1', price: '100', taxRate: '15', taxLabel: 'Sales Tax' });
  renderItemsEditor();
  renderInvoice();
};

$('k_std').onclick = () => {
  kind = 'standard';
  $('k_std').className = 'active';
  $('k_smp').className = '';
  renderInvoice();
};

$('k_smp').onclick = () => {
  kind = 'simplified';
  $('k_smp').className = 'active';
  $('k_std').className = '';
  renderInvoice();
};

$('lang_btn').onclick = () => {
  lang = lang === 'ar' ? 'fr' : 'ar';
  applyLabels();
  renderItemsEditor();
  renderInvoice();
};

$('pdf_btn').onclick = downloadInvoicePDF;
$('print_btn').onclick = () => window.print();

applyLabels();
renderItemsEditor();
renderInvoice();
</script>
